<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="설문">
<title>만족도 설문</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1f; --muted: #6e6e73;
    --line: #e3e1dc; --accent: #2f6fde; --accent-ink: #ffffff; --sel: #eaf1fd;
    --warn-bg: #fff3cd; --warn-ink: #664d03;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214; --card: #1c1c1f; --ink: #f2f2f2; --muted: #a0a0a6;
      --line: #2e2e33; --accent: #5b8ff0; --sel: #1e2a44;
      --warn-bg: #3a3112; --warn-ink: #f3dc8f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    -webkit-text-size-adjust: 100%;
    touch-action: manipulation;              /* 더블탭 확대 방지 */
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
  }
  .app {
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    max-width: 820px; margin: 0 auto;
    padding: max(24px, env(safe-area-inset-top)) 32px max(24px, env(safe-area-inset-bottom));
  }
  .progress { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; visibility: hidden; }
  .progress.show { visibility: visible; }
  .bar { height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }

  main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 32px 0; }
  .step { font-size: 18px; color: var(--muted); margin: 0 0 8px; }
  h1 { font-size: 40px; margin: 0 0 12px; line-height: 1.3; word-break: keep-all; }

  /* 첫 화면 — 탈 하나로 "그 게임" 임을 알린다. 체험을 막 마치고 온 분이 보는 화면이라
     설명이 아니라 알아보는 그림이 먼저다. 목중 탈은 부스에서 실제로 쓰는 배역이다. */
  .mask {
    display: block; width: clamp(120px, 26vw, 200px); height: auto;
    margin: 0 auto 18px; filter: drop-shadow(0 6px 18px rgba(0,0,0,.18));
  }
  .game {
    text-align: center; margin: 0 0 6px; font-size: 20px; font-weight: 600;
    letter-spacing: .02em; color: var(--muted);
  }
  h2 { font-size: 32px; margin: 0 0 8px; line-height: 1.35; word-break: keep-all; }
  .hint { font-size: 19px; color: var(--muted); margin: 0 0 28px; word-break: keep-all; }

  .options { display: grid; gap: 14px; }
  .opt {
    display: flex; align-items: center; gap: 16px; width: 100%;
    min-height: 72px; padding: 16px 24px;
    font: inherit; font-size: 24px; text-align: left;
    background: var(--card); color: var(--ink);
    border: 2px solid var(--line); border-radius: 16px; cursor: pointer;
  }
  .opt .mark {
    width: 28px; height: 28px; flex: none; display: grid; place-items: center;
    border: 2px solid var(--line); border-radius: 50%;
  }
  .opt.multi .mark { border-radius: 8px; }
  .opt[aria-checked="true"] { border-color: var(--accent); background: var(--sel); }
  .opt[aria-checked="true"] .mark { border-color: var(--accent); background: var(--accent); }
  .opt[aria-checked="true"] .mark::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #fff; }
  .opt.multi[aria-checked="true"] .mark::after {
    width: 7px; height: 13px; border-radius: 0; background: none;
    border: solid #fff; border-width: 0 3px 3px 0; transform: translateY(-2px) rotate(45deg);
  }

  .scale { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 12px; }
  .scale .opt { justify-content: center; padding: 0; min-height: 96px; font-size: 32px; font-weight: 600; }
  .scale-labels { display: flex; justify-content: space-between; margin-top: 12px; font-size: 18px; color: var(--muted); }

  /* 별점 — 별 하나가 왼쪽·오른쪽 두 칸이다. 왼쪽이 0.5, 오른쪽이 1.0 (§renderStars) */
  .picker {
    width: 100%; padding: 22px 18px; font: inherit; font-size: 26px; text-align: center;
    background: var(--card); color: var(--ink);
    border: 2px solid var(--line); border-radius: 16px; -webkit-appearance: none; appearance: none;
  }
  .picker:focus { outline: none; border-color: var(--accent); }

  .stars { display: flex; gap: 6px; justify-content: center; }
  .star { position: relative; width: 17%; max-width: 104px; aspect-ratio: 1/1; line-height: 1; }
  /* 두 별을 <b>똑같이</b> 포개 두고 위쪽만 잘라 낸다. 폭을 줄여 가리면 글자가 왼쪽으로
     밀려 아래 별과 어긋나는데, clip-path 는 자리를 그대로 두고 보이는 데만 자른다. */
  .star .ghost, .star .fill {
    position: absolute; inset: 0; line-height: 1;
    font-size: clamp(44px, 13vw, 92px);
    display: flex; align-items: center; justify-content: center;
  }
  .star .ghost { color: var(--line); }
  .star .fill { color: #F2B300; clip-path: inset(0 100% 0 0); transition: clip-path .1s ease; }
  .star .half { position: absolute; top: 0; height: 100%; width: 50%; border: 0; padding: 0;
                background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .star .half.L { left: 0; }  .star .half.R { right: 0; }
  .star .half:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; border-radius: 8px; }
  .stars-value { text-align: center; margin-top: 14px; font-size: 26px; font-weight: 600; color: var(--ink); }

  /* 밀어서 고르는 값 — 가격처럼 폭이 넓은 숫자 (§renderRange) */
  .range-value { text-align: center; font-size: 40px; font-weight: 700; color: var(--ink);
                 margin: 4px 0 18px; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; height: 52px; background: none; -webkit-appearance: none; appearance: none; }
  input[type=range]::-webkit-slider-runnable-track { height: 10px; border-radius: 5px;
    background: linear-gradient(90deg, var(--accent) var(--fill, 50%), var(--line) var(--fill, 50%)); }
  input[type=range]::-moz-range-track { height: 10px; border-radius: 5px; background: var(--line); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none;
    width: 44px; height: 44px; margin-top: -17px; border-radius: 50%;
    background: var(--card); border: 3px solid var(--accent); box-shadow: 0 2px 10px rgba(0,0,0,.18); }
  input[type=range]::-moz-range-thumb { width: 38px; height: 38px; border-radius: 50%;
    background: var(--card); border: 3px solid var(--accent); }
  .range-ticks { display: flex; justify-content: space-between; color: var(--muted); font-size: 17px; }

  textarea {
    width: 100%; min-height: 220px; padding: 20px;
    font: inherit; font-size: 22px; resize: vertical;
    background: var(--card); color: var(--ink);
    border: 2px solid var(--line); border-radius: 16px;
    -webkit-user-select: text; user-select: text;
  }
  textarea:focus { outline: none; border-color: var(--accent); }

  .nav { display: flex; gap: 14px; }
  .btn {
    flex: 1; min-height: 72px; font: inherit; font-size: 24px; font-weight: 600;
    background: var(--card); color: var(--ink);
    border: 2px solid var(--line); border-radius: 16px; cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.ghost { flex: 0 0 160px; }
  .btn:disabled { opacity: .35; }

  .center { text-align: center; }
  .status { margin-top: 24px; font-size: 15px; color: var(--muted); }
  .warn { margin-bottom: 24px; padding: 14px 18px; border-radius: 12px; font-size: 17px; background: var(--warn-bg); color: var(--warn-ink); }

  @media (max-width: 600px) {
    .app { padding-left: 16px; padding-right: 16px; }
    h1 { font-size: 28px; } h2 { font-size: 24px; }
    .mask { width: clamp(100px, 30vw, 150px); margin-bottom: 12px; }
    .opt { font-size: 20px; min-height: 60px; }
    .scale .opt { font-size: 24px; min-height: 72px; }
    .btn { font-size: 20px; min-height: 60px; } .btn.ghost { flex-basis: 100px; }
  }

  /* 녹음 */
  :root { --rec: #e03131; }
  .recorder {
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    padding: 32px 24px; background: var(--card);
    border: 2px solid var(--line); border-radius: 20px;
  }
  .rec-btn {
    width: 168px; height: 168px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--rec); color: #fff; font: inherit; font-size: 22px; font-weight: 700;
  }
  .rec-btn.on { animation: pulse 1.4s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(224, 49, 49, .5); }
    70% { box-shadow: 0 0 0 26px rgba(224, 49, 49, 0); }
    100% { box-shadow: 0 0 0 0 rgba(224, 49, 49, 0); }
  }
  .rec-time { font-size: 28px; font-variant-numeric: tabular-nums; }
  .recorder audio { width: 100%; }
  .recorder .btn { flex: none; width: 100%; }
  .rec-note { font-size: 18px; color: var(--muted); margin: 0; text-align: center; }
  .err { font-size: 18px; color: var(--rec); margin: 0; text-align: center; word-break: keep-all; }
</style>
</head>
<body>
<div class="app">
  <div class="progress" id="progress"><div class="bar" id="bar"></div></div>
  <main id="screen"></main>
  <div class="nav" id="nav"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* =====================================================================
   ✏️ 여기만 고치면 돼요
   ===================================================================== */

// Apps Script 웹 앱 URL (끝이 /exec)
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyIbgQzquZ9rbOW3ODT_jgpY_bKZr1HOK8-qOhcUgUDnkNlFVBxTqEd1RFgdBqSLYSnuQ/exec';

const SURVEY = {
  game:  '탈춤 코칭 게임 얼쑤',   // 설문 제목 위에 작게
  title: '서비스 만족도 설문',
  intro: '2분 정도 걸려요. 솔직하게 답해 주시면 큰 도움이 됩니다.',
  thanks: '응답해 주셔서 감사합니다!',
  resetSeconds: 6,        // 제출 후 처음 화면으로 돌아가기까지 (초)
  idleResetSeconds: 120,  // 중간에 자리를 떠나면 이 시간 뒤 처음으로 (초)
  maxRecordSeconds: 60,   // 녹음 최대 길이 (초)
};

/*  문항 형식
    single : 하나만 고르기         options: [...]
    multi  : 여러 개 고르기        options: [...]
    scale  : 숫자 척도             min, max, labels: [왼쪽 설명, 오른쪽 설명]
    stars  : 별점(0.5 단위)        max (기본 5)
    select : 돌려서 고르기(연도)    years: [시작, 끝]
    range  : 밀어서 고르기          min, max, step, start, ticks: [...], format: v => '...'
    text   : 자유 서술             placeholder
    record : 음성 녹음             (녹음 파일은 드라이브에, 시트에는 링크가 들어가요)
    desc   : 제목 아래 작은 설명 (선택)
    showIf : 앞 응답에 따라 보여 줄지 정하기 (선택)
    id는 영문/숫자/밑줄로만 — 구글 시트 열 제목이 됩니다. */
const QUESTIONS = [
  { id: 'birth_year', type: 'select', required: true,
    title: '태어난 해를 골라 주세요',
    desc: '돌려서 고르면 돼요',
    years: [1945, 2012] },          // 만 14세 이상만 체험하므로 2012년생까지

  { id: 'rating', type: 'stars', required: true,
    title: '이 게임에 별점을 남긴다면?',
    desc: '별의 왼쪽을 누르면 반 개, 오른쪽을 누르면 한 개예요',
    max: 5 },

  { id: 'play_intent', type: 'single', required: true,
    title: '이 게임이 출시된다면 플레이할 의향이 있으신가요?',
    options: ['꼭 해보고 싶다', '해보고 싶다', '보통', '별로', '안 할 것 같다'] },

  { id: 'price', type: 'range', required: true,
    title: '이 게임의 가격은 얼마가 적당한가요?',
    desc: '밀어서 맞춰 주세요',
    min: 0, max: 20000, step: 1000, start: 10000,
    ticks: ['무료', '1만원', '2만원'],
    format: v => v === 0 ? '무료라면 할래요' : v.toLocaleString('ko-KR') + '원' },

  { id: 'liked', type: 'multi', required: true,
    title: '가장 인상 깊었던 기능은?',
    options: ['내 얼굴로 탈 만들기', '연습 게임(튜토리얼)', '본 체험', '없음'] },

  { id: 'lacked', type: 'multi', required: true,
    title: '부족했던 기능은?',
    options: ['내 얼굴로 탈 만들기', '연습 게임(튜토리얼)', '본 체험', '없음'] },

  { id: 'voice', type: 'record', required: false,
    title: '가장 기억에 남는 순간이나, 아쉬웠던 점을 한 가지만 들려주세요',
    desc: '부족했던 기능은 어떻게 보완되면 좋을지도 좋아요. 버튼을 누르고 자유롭게 말씀해 주세요 — '
        + '음성은 이 아이패드에만 저장되고, 서비스 개선에만 씁니다.' },
];

/* =====================================================================
   아래는 고치지 않아도 돼요
   ===================================================================== */

const N = QUESTIONS.length;
const $screen = document.getElementById('screen');
const $nav = document.getElementById('nav');
const $progress = document.getElementById('progress');
const $bar = document.getElementById('bar');

let step = -1;          // -1: 시작 화면, 0..N-1: 문항, N: 완료 화면
let answers = {};
let advanceTimer, resetTimer, idleTimer, countdownTimer;
let nextBtn = null;

/* ---------- 문항 표시 여부 / 이동 ---------- */
const isVisible = q => !q.showIf || q.showIf(answers);
function nextIdx(i) { for (let j = i + 1; j < N; j++) if (isVisible(QUESTIONS[j])) return j; return -1; }
function prevIdx(i) { for (let j = i - 1; j >= 0; j--) if (isVisible(QUESTIONS[j])) return j; return -1; }

/* ---------- 저장소: 녹음이 들어가도 넉넉하게 IndexedDB 사용 ---------- */
const DB = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('survey', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  return {
    async get(k) {
      const db = await open();
      return new Promise((res, rej) => {
        const r = db.transaction('kv').objectStore('kv').get(k);
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    },
    async set(k, v) {
      const db = await open();
      return new Promise((res, rej) => {
        const tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(v, k);
        tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
      });
    },
    async keys() {
      const db = await open();
      return new Promise((res, rej) => {
        const r = db.transaction('kv').objectStore('kv').getAllKeys();
        r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error);
      });
    },
    async del(k) {
      const db = await open();
      return new Promise((res, rej) => {
        const tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').delete(k);
        tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
      });
    },
  };
})();

/* ---------- 녹음은 이 기기에만 남는다 ----------
   응답은 시트로 보내지만 음성은 보내지 않는다. 목소리는 사람을 가려낼 수 있는 정보라,
   밖으로 내보내면 국외 이전을 따로 고지하고 동의를 받아야 한다. 기기에 두면 그 일이 없다.

   대신 <b>이어 볼 수 있어야</b> 한다. 시트의 submission_id 와 같은 이름으로 파일을 만들어,
   나중에 "이 응답의 음성" 을 헷갈리지 않고 찾을 수 있게 한다. 시트 칸에는 길이를 적어
   어느 줄에 음성이 있는지 눈으로도 보이게 한다.                                        */
const AUDIO_PREFIX = 'audio:';
const audioKey = (sid, qid) => AUDIO_PREFIX + sid + ':' + qid;

async function keepAudio(sid, qid, rec) {
  try {
    await DB.set(audioKey(sid, qid), {
      sid, qid, blob: rec.blob, type: rec.type, seconds: rec.seconds,
      at: new Date().toISOString(),
    });
    return true;
  } catch (e) { console.warn('녹음 저장 실패:', e); return false; }
}
async function listAudio() {
  const out = [];
  for (const k of await DB.keys()) {
    if (typeof k === 'string' && k.startsWith(AUDIO_PREFIX)) {
      const v = await DB.get(k);
      if (v && v.blob) out.push({ key: k, ...v });
    }
  }
  return out.sort((a, b) => (a.at < b.at ? -1 : 1));
}

/* ---------- 전송 대기열: 먼저 iPad에 저장하고, 인터넷이 되면 시트로 전송 ---------- */
let queue = [];
const ready = (async () => {
  try { queue = (await DB.get('queue')) || []; } catch (e) { console.warn(e); }
  try { // 예전 버전(localStorage)에 남은 응답 옮기기
    const old = JSON.parse(localStorage.getItem('survey_queue_v1') || '[]');
    if (old.length) { queue = queue.concat(old); await saveQueue(); localStorage.removeItem('survey_queue_v1'); }
  } catch {}
  updateStatus();
})();
function saveQueue() {
  return DB.set('queue', queue).catch(err => console.warn('iPad 저장 실패:', err));
}

let flushing = false;
async function flush() {
  await ready;
  if (flushing || !SCRIPT_URL || !queue.length) return;
  flushing = true;
  try {
    while (queue.length) {
      const res = await fetch(SCRIPT_URL, { method: 'POST', body: new URLSearchParams(queue[0]) });
      const data = await res.json();
      if (data.result !== 'ok') throw new Error(data.message || '서버 오류');
      queue.shift();
      await saveQueue();
    }
  } catch (err) {
    console.warn('전송 보류 (나중에 다시 시도):', err);
  } finally {
    flushing = false;
    updateStatus();
  }
}
window.addEventListener('online', flush);
setInterval(flush, 30000);

function updateStatus() {
  const el = document.getElementById('status');
  if (!el) return;
  el.textContent = queue.length
    ? `미전송 응답 ${queue.length}건 · 인터넷에 연결되면 자동으로 전송돼요`
    : '';
}

function makeId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

async function submit() {
  await ready;
  const sid = makeId();
  const payload = { submission_id: sid, _order: QUESTIONS.map(q => q.id).join(',') };
  for (const q of QUESTIONS) {
    const v = isVisible(q) ? answers[q.id] : undefined;
    if (q.type === 'record') {
      // 음성은 시트로 보내지 않는다(§AUDIO_PREFIX). 기기에 남기고, 칸에는 '있다는 것' 만 적는다 —
      // 그래야 어느 줄에 음성이 있는지 시트만 봐도 알고, 파일은 같은 submission_id 로 찾는다.
      if (v && v.blob) {
        const kept = await keepAudio(sid, q.id, v);
        payload[q.id] = kept ? `음성 ${v.seconds}초 · 기기 보관` : '음성 저장 실패';
      } else {
        payload[q.id] = '';
      }
    } else {
      payload[q.id] = Array.isArray(v) ? v.join(', ') : (v ?? '');
    }
  }
  queue.push(payload);
  await saveQueue();
  step = N;
  render();
  flush();
}

/* ---------- 녹음 ---------- */
let rec = null;       // 녹음 중인 세션
let recError = '';

function pickMimeType() {
  if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
  return ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm']
    .find(t => MediaRecorder.isTypeSupported(t)) || '';
}


async function startRecording(q) {
  recError = '';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
    recError = '이 화면에서는 녹음을 쓸 수 없어요. 녹음 없이 다음으로 넘어가 주세요.';
    return render();
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    recError = '마이크를 쓸 수 없어요. 마이크 권한을 허용하거나, 녹음 없이 다음으로 넘어가 주세요.';
    return render();
  }
  const mime = pickMimeType();
  const recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  const session = { recorder, stream, chunks: [], startedAt: Date.now(), qid: q.id, discard: false };

  recorder.ondataavailable = e => { if (e.data && e.data.size) session.chunks.push(e.data); };
  recorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    clearInterval(session.tick);
    clearTimeout(session.limit);
    if (rec === session) rec = null;
    if (session.discard) return;
    const type = recorder.mimeType || mime || 'audio/mp4';
    const blob = new Blob(session.chunks, { type });
    const seconds = Math.max(1, Math.round((Date.now() - session.startedAt) / 1000));
    const prev = answers[q.id];
    if (prev && prev.url) URL.revokeObjectURL(prev.url);
    answers[q.id] = { blob, type, seconds, url: URL.createObjectURL(blob) };
    // 마지막 문항의 녹음을 끝낸 것은 곧 설문을 마친 것이다 — 말을 마친 분에게 「제출」을
    // 한 번 더 누르게 하지 않는다. 뒤에 줄이 서 있는 자리라 탭 하나가 아깝다.
    if (QUESTIONS[step] === q && nextIdx(step) === -1) { submit(); return; }
    if (QUESTIONS[step] === q) render();
  };

  recorder.start(1000);
  session.tick = setInterval(updateRecTimer, 250);
  session.limit = setTimeout(() => stopRecording(), SURVEY.maxRecordSeconds * 1000);
  rec = session;
  render();
}

function stopRecording(discard = false) {
  if (!rec) return;
  const s = rec;
  s.discard = discard;
  if (discard) rec = null;
  if (s.recorder.state !== 'inactive') s.recorder.stop();
}

function updateRecTimer() {
  const el = document.getElementById('rec-time');
  if (!el || !rec) return;
  const sec = Math.floor((Date.now() - rec.startedAt) / 1000);
  el.textContent = `${sec}초 / ${SURVEY.maxRecordSeconds}초`;
}

function renderRecorder(q) {
  const box = h('div', { class: 'recorder' });
  const a = answers[q.id];

  if (rec && rec.qid === q.id) {
    box.append(
      h('button', { type: 'button', class: 'rec-btn on', onclick: () => stopRecording() }, '■ 끝내기'),
      h('div', { class: 'rec-time', id: 'rec-time' }, `0초 / ${SURVEY.maxRecordSeconds}초`),
      h('p', { class: 'rec-note' }, '녹음 중이에요'),
    );
  } else if (a && a.url) {
    const audio = h('audio', { controls: true, preload: 'metadata' });
    audio.src = a.url;
    box.append(
      h('p', { class: 'rec-note' }, `✓ ${a.seconds}초 녹음됐어요. 들어 보고 괜찮으면 다음으로 넘어가 주세요.`),
      audio,
      h('button', { type: 'button', class: 'btn', onclick: () => startRecording(q) }, '다시 녹음하기'),
    );
  } else {
    box.append(
      h('button', { type: 'button', class: 'rec-btn', onclick: () => startRecording(q) }, '● 녹음 시작'),
      h('p', { class: 'rec-note' }, '처음에는 마이크 사용 허용 창이 뜰 수 있어요'),
    );
  }
  if (recError) box.append(h('p', { class: 'err' }, recError));
  return box;
}

/* ---------- 화면 ---------- */
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c);
  return el;
}

function isAnswered(q) {
  const v = answers[q.id];
  if (q.type === 'multi') return Array.isArray(v) && v.length > 0;
  if (q.type === 'text') return typeof v === 'string' && v.trim() !== '';
  if (q.type === 'record') return !!(v && v.blob);
  if (q.type === 'stars') return Number(v) > 0;
  if (q.type === 'select') return typeof v === 'string' && v !== '';
  if (q.type === 'range') return v != null;   // 밀지 않아도 기본값이 답이다
  return v != null && v !== '';
}

function refreshNext() {
  const q = QUESTIONS[step];
  if (!nextBtn || !q) return;
  nextBtn.disabled = !!rec || (q.required && !isAnswered(q));
}

function go(to) {
  clearTimeout(advanceTimer);
  stopRecording(true);
  recError = '';
  step = to;
  render();
}

function choose(q, value) {
  if (q.type === 'multi') {
    const cur = new Set(answers[q.id] || []);
    // 「없음」은 다른 것과 함께 고를 수 없다 — 모순된 응답을 애초에 막는다
    if (value === '없음') {
      cur.has('없음') ? cur.clear() : (cur.clear(), cur.add('없음'));
    } else {
      cur.delete('없음');
      cur.has(value) ? cur.delete(value) : cur.add(value);
    }
    answers[q.id] = q.options.filter(o => cur.has(o)); // 보기 순서 유지
    render();
    return;
  }
  answers[q.id] = value;
  render();
  // 하나만 고르는 문항은 고르면 자동으로 다음으로 (마지막 문항 제외)
  clearTimeout(advanceTimer);
  const nx = nextIdx(step);
  if (nx !== -1) advanceTimer = setTimeout(() => go(nx), 280);
}

function optionButton(q, value, label, multi) {
  const selected = multi
    ? (answers[q.id] || []).includes(value)
    : answers[q.id] === value;
  return h('button', {
    type: 'button',
    class: 'opt' + (multi ? ' multi' : ''),
    role: multi ? 'checkbox' : 'radio',
    'aria-checked': String(selected),
    onclick: () => choose(q, value),
  }, q.type === 'scale' ? null : h('span', { class: 'mark' }), label);
}

function renderQuestion(q) {
  const visibleList = QUESTIONS.filter(isVisible);
  const hint = q.desc
    || (q.type === 'multi' ? '여러 개 고를 수 있어요'
      : !q.required ? '선택 응답이에요. 건너뛰어도 괜찮아요' : '');
  const parts = [
    h('p', { class: 'step' }, `${visibleList.indexOf(q) + 1} / ${visibleList.length}`),
    h('h2', {}, q.title),
    h('p', { class: 'hint' }, hint || ' '),
  ];

  if (q.type === 'single' || q.type === 'multi') {
    parts.push(h('div', { class: 'options', role: q.type === 'multi' ? 'group' : 'radiogroup' },
      q.options.map(o => optionButton(q, o, o, q.type === 'multi'))));
  } else if (q.type === 'scale') {
    const nums = [];
    for (let i = q.min; i <= q.max; i++) nums.push(i);
    parts.push(h('div', { class: 'scale', role: 'radiogroup', style: `--n:${nums.length}` },
      nums.map(n => optionButton(q, String(n), String(n), false))));
    if (q.labels) parts.push(h('div', { class: 'scale-labels' },
      h('span', {}, q.labels[0]), h('span', {}, q.labels[1])));
  } else if (q.type === 'select') {
    parts.push(renderSelect(q));
  } else if (q.type === 'stars') {
    parts.push(renderStars(q));
  } else if (q.type === 'range') {
    parts.push(renderRange(q));
  } else if (q.type === 'text') {
    const ta = h('textarea', {
      placeholder: q.placeholder || '',
      oninput: e => { answers[q.id] = e.target.value; refreshNext(); },
    });
    ta.value = answers[q.id] || '';
    parts.push(ta);
  } else if (q.type === 'record') {
    parts.push(renderRecorder(q));
  }
  return parts;
}

/* 돌려서 고르기 — iOS 사파리는 <select> 를 화면 아래 <b>돌림판</b>으로 띄운다.
   해가 일흔 개가 넘어 단추로 늘어놓을 수 없고, 숫자를 치게 하면 오타와 키보드가 끼어든다.
   years: [시작, 끝] 을 받아 <b>최근 해부터</b> 보여 준다 — 체험자 대부분이 젊은 쪽이다. */
function renderSelect(q) {
  const [from, to] = q.years || [1945, 2012];
  const sel = h('select', { class: 'picker', 'aria-label': q.title,
    onchange: e => { answers[q.id] = e.target.value; refreshNext(); } });
  sel.append(h('option', { value: '' }, '선택해 주세요'));
  for (let y = to; y >= from; y--) sel.append(h('option', { value: String(y) }, y + '년'));
  sel.value = answers[q.id] || '';
  return sel;
}

/* 별점 — 반 칸까지 준다.
   별 하나를 왼쪽·오른쪽 두 칸으로 나눠 왼쪽을 누르면 0.5, 오른쪽을 누르면 1.0 이다.
   손가락으로 '반 개' 를 정확히 집는 것은 어려우니, 칸을 나눠 어느 쪽을 눌렀는지로 가른다.   */
function renderStars(q) {
  const max = q.max || 5;
  const box = h('div', { class: 'stars', role: 'slider',
    'aria-valuemin': 0, 'aria-valuemax': max, 'aria-label': q.title });
  const out = h('p', { class: 'stars-value' });

  function paint() {
    const v = Number(answers[q.id] || 0);
    [...box.children].forEach((st, i) => {
      const full = v >= i + 1, half = !full && v >= i + 0.5;
      st.querySelector('.fill').style.clipPath =
        full ? 'inset(0 0 0 0)' : half ? 'inset(0 50% 0 0)' : 'inset(0 100% 0 0)';
    });
    out.textContent = v ? v.toFixed(1).replace(/\.0$/, '') + '점' : '별을 눌러 주세요';
    box.setAttribute('aria-valuenow', v);
  }

  for (let i = 0; i < max; i++) {
    const st = h('div', { class: 'star' },
      h('span', { class: 'ghost' }, '★'),
      h('span', { class: 'fill' }, '★'));
    [['L', i + 0.5], ['R', i + 1]].forEach(([side, val]) => {
      st.append(h('button', {
        type: 'button', class: 'half ' + side, 'aria-label': val + '점',
        onclick: () => { answers[q.id] = val; paint(); refreshNext(); },
      }));
    });
    box.append(st);
  }
  paint();
  return h('div', {}, box, out);
}

/* 가격처럼 폭이 넓은 숫자 — 보기를 늘어놓는 대신 밀어서 고른다.
   척도(scale)는 1~5 처럼 칸이 적을 때 쓰고, 0~20,000 같은 값에는 이쪽이 맞다. */
function renderRange(q) {
  const min = q.min ?? 0, max = q.max ?? 100, step = q.step ?? 1;
  const fmt = q.format || (v => String(v));
  if (answers[q.id] == null) answers[q.id] = q.start ?? Math.round((min + max) / 2 / step) * step;

  const out = h('p', { class: 'range-value' });
  const input = h('input', { type: 'range', min, max, step, 'aria-label': q.title });
  input.value = answers[q.id];

  function paint() {
    const v = Number(input.value);
    answers[q.id] = v;
    out.textContent = fmt(v);
    input.style.setProperty('--fill', ((v - min) / (max - min) * 100) + '%');
  }
  input.addEventListener('input', () => { paint(); refreshNext(); });
  paint();

  const ticks = q.ticks
    ? h('div', { class: 'range-ticks' }, q.ticks.map(t => h('span', {}, t)))
    : null;
  return h('div', {}, out, input, ticks);
}

function render() {
  clearTimeout(resetTimer);
  clearInterval(countdownTimer);
  $screen.replaceChildren();
  $nav.replaceChildren();
  nextBtn = null;

  const inQuestions = step >= 0 && step < N;
  $progress.classList.toggle('show', inQuestions);
  if (inQuestions) {
    const list = QUESTIONS.filter(isVisible);
    $bar.style.width = `${((list.indexOf(QUESTIONS[step]) + 1) / list.length) * 100}%`;
  } else {
    $bar.style.width = '0';
  }

  if (step === -1) {
    $screen.append(
      SCRIPT_URL ? '' : h('div', { class: 'warn' },
        '⚠️ SCRIPT_URL이 비어 있어요. 응답은 이 iPad에만 저장되고 시트로 전송되지 않아요.'),
      h('img', { class: 'mask', src: 'mask.png', alt: '봉산탈춤 목중 탈' }),
      h('p', { class: 'game' }, SURVEY.game),
      h('h1', { class: 'center' }, SURVEY.title),
      h('p', { class: 'hint center' }, SURVEY.intro),
      h('p', { class: 'status', id: 'status' }),
    );
    $nav.append(h('button', { type: 'button', class: 'btn primary', onclick: () => go(nextIdx(-1)) }, '시작하기'));
    updateStatus();
    return;
  }

  if (inQuestions) {
    const q = QUESTIONS[step];
    const nx = nextIdx(step);
    $screen.append(...renderQuestion(q));
    $nav.append(h('button', { type: 'button', class: 'btn ghost', onclick: () => go(prevIdx(step)) }, '이전'));
    nextBtn = h('button', {
      type: 'button', class: 'btn primary',
      onclick: () => (nx === -1 ? (nextBtn.disabled = true, submit()) : go(nx)),
    }, nx === -1 ? '제출하기' : '다음');
    $nav.append(nextBtn);
    refreshNext();
    return;
  }

  // 완료 화면
  let left = SURVEY.resetSeconds;
  const sub = h('p', { class: 'hint' }, `${left}초 후 처음 화면으로 돌아가요`);
  $screen.append(h('div', { class: 'center' }, h('h1', {}, SURVEY.thanks), sub));
  $nav.append(h('button', { type: 'button', class: 'btn', onclick: restart }, '처음으로'));
  countdownTimer = setInterval(() => {
    left -= 1;
    sub.textContent = `${Math.max(left, 0)}초 후 처음 화면으로 돌아가요`;
  }, 1000);
  resetTimer = setTimeout(restart, SURVEY.resetSeconds * 1000);
}

function restart() {
  for (const v of Object.values(answers)) if (v && v.url) URL.revokeObjectURL(v.url);
  answers = {};
  go(-1);
}

/* 응답 도중 자리를 떠나면 일정 시간 뒤 처음으로 (다음 사람이 이어서 쓰지 않게) */
function bumpIdle() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (step >= 0 && step < N && !rec) restart();
    else if (rec) bumpIdle();
  }, SURVEY.idleResetSeconds * 1000);
}
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, bumpIdle, { passive: true }));

render();
bumpIdle();
flush();

/* ═══════════ 운영자 — 기기에 남은 음성 꺼내기 ═══════════
   왼쪽 위 모서리를 다섯 번 톡톡 치면 열린다. 체험자가 우연히 열 수 있으면 안 되고,
   운영자는 설명 없이 열 수 있어야 해서 '아는 사람만 아는' 자리로 둔다.

   파일 이름이 submission_id 다 — 시트의 같은 칸을 찾으면 그 응답이다.          */
(function adminPanel(){
  const corner = document.createElement('div');
  corner.style.cssText = 'position:fixed;top:0;left:0;width:84px;height:84px;z-index:9998';
  document.body.appendChild(corner);

  const box = document.createElement('div');
  box.hidden = true;
  box.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0b0b0cf5;color:#eee;'
    + 'padding:28px;overflow:auto;font:15px/1.6 -apple-system,BlinkMacSystemFont,sans-serif';
  document.body.appendChild(box);

  let taps = 0, last = 0;
  corner.addEventListener('pointerdown', () => {
    const now = Date.now();
    taps = (now - last < 900) ? taps + 1 : 1;
    last = now;
    if (taps >= 5) { taps = 0; open(); }
  });

  const esc = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
  const fmt = sec => String((sec / 60) | 0).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
  const extOf = t => (t || '').includes('mp4') ? 'm4a' : 'webm';

  function dl(blob, name) {
    const u = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = u; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 1500);
  }

  async function open() {
    const list = await listAudio();
    box.innerHTML = '';
    const h = (t, html) => { const e = document.createElement(t); e.innerHTML = html; box.appendChild(e); return e; };
    h('h2', '운영자');
    h('p', `기기에 남은 음성 <b>${list.length}건</b> · 미전송 응답 ${queue.length}건`);
    h('p', '<small>파일 이름이 시트의 submission_id 다. 그 줄의 응답과 짝이다.</small>');

    const row = h('div', '');
    row.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;margin:18px 0';
    const btn = (label, fn) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.style.cssText = 'padding:13px 18px;border:0;border-radius:10px;background:#2b2b2e;color:#eee;font:inherit;cursor:pointer';
      b.onclick = fn; row.appendChild(b); return b;
    };

    const note = document.createElement('p');
    note.style.cssText = 'color:#e0a86b;min-height:24px';

    btn('음성 전체 내려받기 (.zip)', async () => {
      if (!list.length) return note.textContent = '내려받을 음성이 없습니다.';
      note.textContent = '만드는 중…';
      if (typeof JSZip === 'undefined') { note.textContent = 'JSZip 을 불러오지 못했습니다. 아래에서 하나씩 받아 주세요.'; return; }
      const zip = new JSZip();
      const idx = [['submission_id', '문항', '길이(초)', '녹음 시각', '파일'].map(esc).join(',')];
      list.forEach(a => {
        const name = `${a.sid}_${a.qid}.${extOf(a.type)}`;
        zip.file('음성/' + name, a.blob);
        idx.push([a.sid, a.qid, a.seconds, a.at, name].map(esc).join(','));
      });
      zip.file('음성목록.csv', '\uFEFF' + idx.join('\r\n'));
      dl(await zip.generateAsync({ type: 'blob' }), `얼쑤설문음성_${new Date().toISOString().slice(0,10).replace(/-/g,'')}.zip`);
      note.textContent = '';
    });

    btn('닫기', () => { box.hidden = true; });
    box.appendChild(note);

    const tbl = document.createElement('table');
    tbl.style.cssText = 'width:100%;border-collapse:collapse;margin-top:14px;font-size:14px';
    tbl.innerHTML = '<thead><tr>'
      + ['submission_id', '문항', '길이', '시각', ''].map(t => `<th style="text-align:left;padding:7px;border-bottom:1px solid #444;color:#999;font-weight:500">${t}</th>`).join('')
      + '</tr></thead>';
    const tb = document.createElement('tbody');
    list.slice().reverse().forEach(a => {
      const tr = document.createElement('tr');
      ['<code>' + a.sid + '</code>', a.qid, fmt(a.seconds), new Date(a.at).toLocaleString('ko-KR')]
        .forEach(v => { const td = document.createElement('td'); td.innerHTML = v;
          td.style.cssText = 'padding:7px;border-bottom:1px solid #2a2a2c'; tr.appendChild(td); });
      const td = document.createElement('td');
      td.style.cssText = 'padding:7px;border-bottom:1px solid #2a2a2c;white-space:nowrap';
      const one = document.createElement('button');
      one.textContent = '받기';
      one.style.cssText = 'padding:6px 12px;border:0;border-radius:7px;background:#3a3a3e;color:#eee;font:inherit;cursor:pointer';
      one.onclick = () => dl(a.blob, `${a.sid}_${a.qid}.${extOf(a.type)}`);
      td.appendChild(one); tr.appendChild(td);
      tb.appendChild(tr);
    });
    tbl.appendChild(tb);
    box.appendChild(tbl);
    box.hidden = false;
  }
})();
</script>
</body>
</html>
